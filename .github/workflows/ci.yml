name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Type Check and Build
      run: npm run build

  docker-build:
    needs: build-and-verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        # Sets push to false because we haven't configured a container registry yet
        # Once you decide where to deploy (e.g. Render, AWS, DockerHub), you can configure credentials and set to true
        push: false
        tags: portfolio-app:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
